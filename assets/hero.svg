<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-label="Shiva Pareek — Co-Founder @ Spinex IT Solutions">
  <defs>
    <radialGradient id="glow" cx="78%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#E8A33D" stop-opacity="0.55">
        <animate attributeName="stop-opacity" values="0.55;0.25;0.55" dur="5s" repeatCount="indefinite"/>
      </stop>
      <stop offset="45%" stop-color="#7A2430" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0B0A09" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="name" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F5F1EA"/>
      <stop offset="35%" stop-color="#FFD08A"/>
      <stop offset="50%" stop-color="#E8A33D"/>
      <stop offset="65%" stop-color="#FFD08A"/>
      <stop offset="100%" stop-color="#F5F1EA"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-1 0;1 0;-1 0" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFC46E"/>
      <stop offset="60%" stop-color="#E8A33D"/>
      <stop offset="100%" stop-color="#7A2430"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#E8A33D" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <filter id="blur"><feGaussianBlur stdDeviation="18"/></filter>
    <clipPath id="frame"><rect width="1200" height="380" rx="22"/></clipPath>
  </defs>

  <style>
    .mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
    .sans { font-family: 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; }
    .role { opacity: 0; animation: roles 12s infinite; }
    .r2 { animation-delay: 3s; } .r3 { animation-delay: 6s; } .r4 { animation-delay: 9s; }
    @keyframes roles { 0%{opacity:0;transform:translateY(10px)} 3%{opacity:1;transform:translateY(0)} 22%{opacity:1;transform:translateY(0)} 25%{opacity:0;transform:translateY(-10px)} 100%{opacity:0} }
    .cursor { animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    .dot { animation: pulse 1.6s ease-in-out infinite; transform-origin: 74px 316px; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.35} }
    .gridmove { animation: drift 8s linear infinite; }
    @keyframes drift { from { transform: translate(0,0); } to { transform: translate(-40px,-40px); } }
    .spin1 { animation: spin 18s linear infinite; transform-origin: 930px 190px; }
    .spin2 { animation: spin 28s linear infinite reverse; transform-origin: 930px 190px; }
    .spin3 { animation: spin 40s linear infinite; transform-origin: 930px 190px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .float { animation: float 6s ease-in-out infinite; }
    .f2 { animation-delay: -2s; } .f3 { animation-delay: -4s; }
    @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-14px)} }
    .in { opacity: 0; animation: fadein .9s ease forwards; }
    .d1{animation-delay:.2s} .d2{animation-delay:.6s} .d3{animation-delay:1s} .d4{animation-delay:1.4s}
    @keyframes fadein { from{opacity:0;transform:translateX(-14px)} to{opacity:1;transform:translateX(0)} }
  </style>

  <g clip-path="url(#frame)">
    <rect width="1200" height="380" fill="#0B0A09"/>
    <g class="gridmove"><rect x="0" y="0" width="1280" height="460" fill="url(#grid)"/></g>
    <rect width="1200" height="380" fill="url(#glow)"/>

    <!-- floating particles -->
    <g fill="#E8A33D">
      <circle class="float" cx="620" cy="70" r="2.5" opacity=".6"/>
      <circle class="float f2" cx="700" cy="300" r="2" opacity=".5"/>
      <circle class="float f3" cx="1120" cy="80" r="3" opacity=".6"/>
      <circle class="float" cx="1150" cy="320" r="2" opacity=".4"/>
      <circle class="float f2" cx="540" cy="250" r="1.5" opacity=".5"/>
      <circle class="float f3" cx="770" cy="40" r="1.5" opacity=".5"/>
    </g>

    <!-- left: identity -->
    <text class="mono in d1" x="70" y="96" font-size="20" fill="#E8A33D">&gt; hello_world() <tspan fill="#8C857B">// I'm</tspan></text>
    <text class="sans in d2" x="66" y="176" font-size="86" font-weight="800" letter-spacing="-2" fill="url(#name)">SHIVA PAREEK</text>

    <g class="mono" font-size="24" fill="#F5F1EA">
      <text x="70" y="226" fill="#E8A33D">»</text>
      <g transform="translate(92 0)">
        <text class="role" x="0" y="226">Co-Founder <tspan fill="#E8A33D">@ Spinex IT Solutions</tspan><tspan class="cursor" fill="#E8A33D"> ▋</tspan></text>
        <text class="role r2" x="0" y="226">Full Stack Developer <tspan fill="#E8A33D">· MERN</tspan><tspan class="cursor" fill="#E8A33D"> ▋</tspan></text>
        <text class="role r3" x="0" y="226">AI × Web <tspan fill="#E8A33D">builder</tspan> 🤖<tspan class="cursor" fill="#E8A33D"> ▋</tspan></text>
        <text class="role r4" x="0" y="226">Ideas → Code → <tspan fill="#E8A33D">Launch</tspan> 🚀<tspan class="cursor" fill="#E8A33D"> ▋</tspan></text>
      </g>
    </g>

    <text class="sans in d3" x="70" y="270" font-size="18" fill="#CFC8BC">Jaipur, India  ·  Websites, web apps &amp; AI products that grow businesses</text>

    <!-- status pill -->
    <g class="in d4">
      <rect x="56" y="296" width="292" height="40" rx="20" fill="#16130F" stroke="#E8A33D" stroke-opacity=".5"/>
      <circle class="dot" cx="80" cy="316" r="6" fill="#4ADE80"/>
      <text class="mono" x="96" y="322" font-size="16" fill="#F5F1EA">available for new projects</text>
    </g>

    <!-- right: orbit system -->
    <circle cx="930" cy="190" r="190" fill="#E8A33D" opacity=".12" filter="url(#blur)"/>
    <g class="spin3"><circle cx="930" cy="190" r="160" fill="none" stroke="#E8A33D" stroke-opacity=".18" stroke-dasharray="2 10"/></g>
    <g class="spin2">
      <circle cx="930" cy="190" r="122" fill="none" stroke="#7A2430" stroke-opacity=".7" stroke-width="1.5"/>
      <g class="mono" font-size="14" font-weight="700">
        <rect x="890" y="56" width="80" height="26" rx="13" fill="#1A1613" stroke="#E8A33D" stroke-opacity=".6"/><text x="930" y="74" text-anchor="middle" fill="#61DAFB">React</text>
        <rect x="1012" y="226" width="76" height="26" rx="13" fill="#1A1613" stroke="#E8A33D" stroke-opacity=".6"/><text x="1050" y="244" text-anchor="middle" fill="#5FA04E">Node</text>
        <rect x="770" y="226" width="96" height="26" rx="13" fill="#1A1613" stroke="#E8A33D" stroke-opacity=".6"/><text x="818" y="244" text-anchor="middle" fill="#47A248">MongoDB</text>
      </g>
    </g>
    <g class="spin1">
      <circle cx="930" cy="190" r="80" fill="none" stroke="#E8A33D" stroke-opacity=".45" stroke-dasharray="6 6"/>
      <g class="mono" font-size="13" font-weight="700">
        <rect x="984" y="118" width="70" height="24" rx="12" fill="#1A1613" stroke="#7A2430"/><text x="1019" y="135" text-anchor="middle" fill="#FFD43B">Python</text>
        <rect x="826" y="236" width="56" height="24" rx="12" fill="#1A1613" stroke="#7A2430"/><text x="854" y="253" text-anchor="middle" fill="#E8A33D">AI</text>
      </g>
    </g>
    <circle cx="930" cy="190" r="46" fill="url(#core)">
      <animate attributeName="r" values="46;50;46" dur="3s" repeatCount="indefinite"/>
    </circle>
    <text class="sans" x="930" y="207" text-anchor="middle" font-size="46" font-weight="800" fill="#0B0A09">S</text>
  </g>
  <rect x=".5" y=".5" width="1199" height="379" rx="22" fill="none" stroke="#E8A33D" stroke-opacity=".25"/>
</svg>
